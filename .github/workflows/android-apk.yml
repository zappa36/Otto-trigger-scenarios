name: android-apk

# Builds the installable debug APK of the Android wrapper whenever the
# wrapper changes. Grab it from the run's Artifacts ("otto-trigger-tests-apk"),
# copy it to the phone, and install (allow "install unknown apps" once).
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: otto-trigger-tests-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
