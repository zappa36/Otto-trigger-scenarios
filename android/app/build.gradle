plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI passes -PbuildNumber=<workflow run number>, so the app version
// matches the Actions run that built it ("1.7" = run #7). Local builds
// are "1.dev".
def buildNumber = String.valueOf(project.findProperty('buildNumber') ?: 'dev')

android {
    namespace 'com.otto.triggerscenarios'
    compileSdk 34

    defaultConfig {
        applicationId "com.otto.triggerscenarios"
        minSdk 26
        targetSdk 34
        versionCode buildNumber.isInteger() ? buildNumber.toInteger() : 1
        versionName "1.${buildNumber}"
    }

    /* A committed debug keystore (standard Android debug credentials —
     * protects nothing, IS nothing) so every CI build carries the same
     * signature and a newer APK installs over the old one. Without it,
     * each runner mints a fresh key and updates fail with a signature
     * mismatch until the app is uninstalled. */
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    // Google Play Services — the real Activity Recognition API
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
